<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity Well</title>
  </head>
  <body>
    <div id="app">
      <!-- Animated Background -->
      <div class="stars"></div>
      <div class="twinkling"></div>
      
      <!-- In-Game UI -->
      <div class="ui-container">
        <!-- MODIFIED: Grouped score and fragments on the left -->
        <div class="left-ui">
          <div class="score-display">
            <span>Score: </span>
            <span id="score">0</span>
          </div>
          <div id="runFragmentsContainer">
            <span class="star-icon">★</span>
            <span id="runFragmentsDisplay">0</span>
          </div>
        </div>
        
        <button id="pauseButton" class="pause-btn">||</button>
      </div>
      <div id="powerUpStatus" class="powerup-hidden"></div>

      <!-- Game Canvas -->
      <canvas id="gameCanvas"></canvas>

      <!-- Main Menu Modal -->
      <div id="mainMenu" class="modal modal-hidden">
        <div class="modal-content">
          <h1>Gravity Well</h1>
          <p>Click and hold to guide the comet. Survive as long as you can.</p>
          <div class="stats-display">
            <div>
              <span>HIGH SCORE</span>
              <span id="highScoreDisplay">0</span>
            </div>
            <div>
              <span>★ FRAGMENTS</span>
              <span id="starFragmentsDisplay">0</span>
            </div>
          </div>
          <button id="playButton" class="btn">Play</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div id="gameOverModal" class="modal modal-hidden">
        <div class="modal-content">
          <h2>Game Over</h2>
          <div class="stats-display">
            <div>
              <span>FINAL SCORE</span>
              <span id="finalScoreElement">0</span>
            </div>
            <div>
              <span>★ EARNED</span>
              <span id="fragmentsEarnedDisplay">0</span>
            </div>
          </div>
          <button id="restartButton" class="btn">Play Again</button>
        </div>
      </div>
      
      <!-- Pause Menu Modal -->
      <div id="pauseMenu" class="modal modal-hidden">
        <div class="modal-content">
          <h2>Paused</h2>
          <button id="resumeButton" class="btn">Resume</button>
          <button id="quitButton" class="btn btn-secondary">Quit to Menu</button>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
