<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity Well</title>
  </head>
  <body>
    <div id="app" class="game-container">
      <div class="ui-container">
        <h1 class="game-title">Gravity Well</h1>
        <p class="game-subtitle">Click and hold to guide the comet. Survive as long as you can.</p>
        <div id="score-container" class="score-display">Score: <span id="score">0</span></div>
      </div>

      <canvas id="gameCanvas"></canvas>

      <!-- Game Over Modal -->
      <div id="gameOverModal" class="modal-hidden">
        <div class="modal-content">
          <h2 class="modal-title">Game Over</h2>
          <p class="modal-text">Final Score: <span id="finalScore">0</span></p>
          <button id="restartButton" class="restart-button">
            Play Again
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
